[project]
name = "vector-store"
version = "0.1.0"
description = "Ingestion + hybrid (BGE-M3 dense + BM25 sparse) search over the clinical knowledge base, backed by ChromaDB."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.52.1",
]

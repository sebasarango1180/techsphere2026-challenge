# Override for Linux hosts with an NVIDIA GPU. Requires the nvidia-container-toolkit.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile tqida --profile docker-models --profile docker-agent up -d
#
# scripts/setup.sh detects `nvidia-smi` and adds this file automatically; you shouldn't
# normally need to pass it by hand. See specs/implementation-plan.md §2.5.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TODO(workstream C/E): if local STT (faster-whisper) or in-process Kokoro TTS should
  # also use CUDA when available, add the same `deploy.resources.reservations.devices`
  # block here for voice-agent, and make sure the base image has CUDA-enabled
  # ctranslate2/torch wheels installed (see services/voice-agent/Dockerfile TODOs).
